name: Build MikrotikBF APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev

      - name: Build APK
  run: |
    set +e
    printf 'y\n%.0s' {1..100} | buildozer android debug
    BUILD_EXIT=$?
    set -e
    if [ $BUILD_EXIT -ne 0 ]; then
      echo "Buildozer exited with code $BUILD_EXIT"
      exit $BUILD_EXIT
    fi

      - name: Cache buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MikrotikBF-APK
          path: bin/*.apk
